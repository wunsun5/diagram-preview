  function renderArea() {
    const yr = document.getElementById('yearFilter').value;
    const rows = (yr === 'ALL') ? allRows : allRows.filter(function(r) { return r.d.startsWith(yr); });
    const wrap = document.getElementById('chartWrap');

    if (rows.length === 0) {
      wrap.innerHTML = '';
      return;
    }

    const W = 960, H = 380;
    const padL = 54, padR = 22, padT = 16, padB = 42;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    const n = rows.length;
    function getX(i) {
      if (n === 1) return padL + plotW / 2;
      return padL + (i / (n - 1)) * plotW;
    }
    function getY(pct) {
      return padT + plotH - (pct / 100) * plotH;
    }

    // Garis grid horizontal 0% - 100%
    let grid = '';
    for (let p = 0; p <= 100; p += 20) {
      const gy = getY(p);
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#e2e8f0" stroke-width="1"/>';
      grid += '<text x="' + (padL - 8) + '" y="' + (gy + 4) + '" font-size="11" text-anchor="end" fill="#475569">' + p + '%</text>';
    }

    // Susun koordinat polygon bertumpuk (K0 bawah, K1 tengah, K2 atas)
    let ptsK0Top = [], ptsK0Bot = [];
    let ptsK1Top = [], ptsK1Bot = [];
    let ptsK2Top = [], ptsK2Bot = [];

    for (let i = 0; i < n; i++) {
      const px = getX(i);
      const y0 = getY(0);
      const yK0 = getY(rows[i].k0);
      const yK1 = getY(Math.min(100, rows[i].k0 + rows[i].k1));
      const yK2 = getY(100);

      ptsK0Top.push(px + ',' + yK0);
      ptsK0Bot.unshift(px + ',' + y0);

      ptsK1Top.push(px + ',' + yK1);
      ptsK1Bot.unshift(px + ',' + yK0);

      ptsK2Top.push(px + ',' + yK2);
      ptsK2Bot.unshift(px + ',' + yK1);
    }

    const polyK0 = '<polygon points="' + ptsK0Top.concat(ptsK0Bot).join(' ') + '" fill="#2ca02c" fill-opacity="0.78" stroke="#1e7e1e" stroke-width="1"/>';
    const polyK1 = '<polygon points="' + ptsK1Top.concat(ptsK1Bot).join(' ') + '" fill="#1f77b4" fill-opacity="0.78" stroke="#155a8a" stroke-width="1"/>';
    const polyK2 = '<polygon points="' + ptsK2Top.concat(ptsK2Bot).join(' ') + '" fill="#d62728" fill-opacity="0.78" stroke="#a31d1d" stroke-width="1"/>';

    // Label sumbu X (maksimal 8 label tanggal agar tidak bertabrakan)
    let xLabels = '';
    const step = Math.max(1, Math.floor((n - 1) / 7));
    for (let i = 0; i < n; i += step) {
      const px = getX(i);
      xLabels += '<line x1="' + px + '" y1="' + (H - padB) + '" x2="' + px + '" y2="' + (H - padB + 5) + '" stroke="#64748b" stroke-width="1"/>';
      xLabels += '<text x="' + px + '" y="' + (H - padB + 18) + '" font-size="10.5" text-anchor="middle" fill="#334155">' + rows[i].d + '</text>';
    }

    wrap.innerHTML =
      '<svg id="areaSvg" viewBox="0 0 ' + W + ' ' + H + '">' +
      grid +
      polyK0 +
      polyK1 +
      polyK2 +
      '<rect x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="none" stroke="#94a3b8" stroke-width="1.2"/>' +
      xLabels +
      '<text x="' + (padL + plotW / 2) + '" y="' + (H - 4) + '" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1e293b">Tanggal Akhir Window</text>' +
      '<text x="15" y="' + (padT + plotH / 2) + '" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1e293b" transform="rotate(-90 15 ' + (padT + plotH / 2) + ')">Proporsi (%)</text>' +
      '<line id="hoverLine" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4,3" style="display:none;"/>' +
      '<rect id="overlayRect" x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="transparent" style="cursor:crosshair;"/>' +
      '</svg>';

    const svgEl = document.getElementById('areaSvg');
    const overlay = document.getElementById('overlayRect');
    const hLine = document.getElementById('hoverLine');
    const tip = document.getElementById('tooltip');

    overlay.addEventListener('mousemove', function(e) {
      const rect = svgEl.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * W;
      let ratio = (relX - padL) / plotW;
      ratio = Math.max(0, Math.min(1, ratio));
      const idx = Math.round(ratio * (n - 1));
      const item = rows[idx];
      const snapX = getX(idx);

      hLine.setAttribute('x1', snapX);
      hLine.setAttribute('x2', snapX);
      hLine.style.display = 'block';

      tip.style.display = 'block';
      const tipX = (e.clientX + 185 > window.innerWidth) ? (e.clientX - 180) : (e.clientX + 14);
      tip.style.left = tipX + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.innerHTML =
        '<b>Window: ' + item.d + '</b> (Total: ' + item.n + ' Emiten)<br>' +
        '<span class="dot-ind" style="background:#d62728;"></span>Klaster 2 (High): <b>' + item.k2.toFixed(2) + '%</b><br>' +
        '<span class="dot-ind" style="background:#1f77b4;"></span>Klaster 1 (Med): <b>' + item.k1.toFixed(2) + '%</b><br>' +
        '<span class="dot-ind" style="background:#2ca02c;"></span>Klaster 0 (Low): <b>' + item.k0.toFixed(2) + '%</b>';
    });

    overlay.addEventListener('mouseleave', function() {
      hLine.style.display = 'none';
      tip.style.display = 'none';
    });
  }

  renderArea();
</script>
