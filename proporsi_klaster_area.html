  let startIdx = 0;
  let endIdx = allRows.length - 1;

  const bulanNama = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  function formatBulanTahun(tglStr) {
    const parts = tglStr.split('-');
    const thn = parts.slice(0, 1).join('');
    const bln = parseInt(parts.slice(1, 2).join(''), 10) - 1;
    const namaBln = bulanNama.slice(bln, bln + 1).join('');
    return namaBln + ' ' + thn;
  }

  function buildPolygons(rows, W, H, padL, padR, padT, padB) {
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const n = rows.length;

    function getX(i) {
      return (n === 1) ? (padL + plotW / 2) : (padL + (i / (n - 1)) * plotW);
    }
    function getY(pct) {
      return padT + plotH - (pct / 100) * plotH;
    }

    let ptsK0Top = [], ptsK0Bot = [];
    let ptsK1Top = [], ptsK1Bot = [];
    let ptsK2Top = [], ptsK2Bot = [];
    let lineK0 = [], lineK1 = [], lineK2 = [];

    for (let i = 0; i < n; i++) {
      const px = getX(i);
      const y0 = getY(0);
      const yK0 = getY(rows[i].k0);
      const yK1 = getY(Math.min(100, rows[i].k0 + rows[i].k1));
      const yK2 = getY(100);

      ptsK0Top.push(px + ',' + yK0);
      ptsK0Bot.unshift(px + ',' + y0);
      lineK0.push(px + ',' + yK0);

      ptsK1Top.push(px + ',' + yK1);
      ptsK1Bot.unshift(px + ',' + yK0);
      lineK1.push(px + ',' + yK1);

      ptsK2Top.push(px + ',' + yK2);
      ptsK2Bot.unshift(px + ',' + yK1);
      lineK2.push(px + ',' + yK2);
    }

    return {
      polyK0: '<polygon points="' + ptsK0Top.concat(ptsK0Bot).join(' ') + '" fill="#2ca02c" fill-opacity="0.52"/>' +
              '<polyline fill="none" stroke="#2ca02c" stroke-width="1.4" points="' + lineK0.join(' ') + '"/>',
      polyK1: '<polygon points="' + ptsK1Top.concat(ptsK1Bot).join(' ') + '" fill="#1f77b4" fill-opacity="0.52"/>' +
              '<polyline fill="none" stroke="#1f77b4" stroke-width="1.4" points="' + lineK1.join(' ') + '"/>',
      polyK2: '<polygon points="' + ptsK2Top.concat(ptsK2Bot).join(' ') + '" fill="#d62728" fill-opacity="0.52"/>' +
              '<polyline fill="none" stroke="#d62728" stroke-width="1.4" points="' + lineK2.join(' ') + '"/>',
      getX: getX,
      getY: getY
    };
  }

  function renderMain() {
    const rows = allRows.slice(startIdx, endIdx + 1);
    const wrap = document.getElementById('mainPlot');
    const W = 1040, H = 310;
    const padL = 44, padR = 12, padT = 10, padB = 24;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    const polys = buildPolygons(rows, W, H, padL, padR, padT, padB);

    let grid = '<rect x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="#e5ecf6"/>';
    for (let p = 0; p <= 100; p += 20) {
      const gy = polys.getY(p);
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '" stroke="#ffffff" stroke-width="1.1"/>';
      grid += '<text x="' + (padL - 7) + '" y="' + (gy + 3.5) + '" font-size="10.5" text-anchor="end" fill="#2a3f5f">' + p + '</text>';
    }

    let xLabels = '';
    const n = rows.length;
    const step = Math.max(1, Math.floor((n - 1) / 8));
    for (let i = 0; i < n; i += step) {
      const px = polys.getX(i);
      grid += '<line x1="' + px + '" y1="' + padT + '" x2="' + px + '" y2="' + (H - padB) + '" stroke="#ffffff" stroke-width="1.1"/>';
      xLabels += '<text x="' + px + '" y="' + (H - padB + 15) + '" font-size="10.5" text-anchor="middle" fill="#2a3f5f">' + formatBulanTahun(rows[i].d) + '</text>';
    }

    wrap.innerHTML =
      '<svg id="mainSvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      grid +
      polys.polyK0 +
      polys.polyK1 +
      polys.polyK2 +
      xLabels +
      '<text x="13" y="' + (padT + plotH / 2) + '" font-size="11.5" text-anchor="middle" fill="#2a3f5f" transform="rotate(-90 13 ' + (padT + plotH / 2) + ')">Proporsi (%)</text>' +
      '<line id="hoverLine" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" stroke="#2a3f5f" stroke-width="1" stroke-dasharray="3,3" style="display:none;"/>' +
      '<rect id="overlayRect" x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="transparent" style="cursor:crosshair;"/>' +
      '</svg>';

    const svgEl = document.getElementById('mainSvg');
    const overlay = document.getElementById('overlayRect');
    const hLine = document.getElementById('hoverLine');
    const tip = document.getElementById('tooltip');

    overlay.addEventListener('mousemove', function(e) {
      const rect = svgEl.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * W;
      let ratio = (relX - padL) / plotW;
      ratio = Math.max(0, Math.min(1, ratio));
      const idx = Math.round(ratio * (n - 1));
      const item = rows[idx];
      const snapX = polys.getX(idx);

      hLine.setAttribute('x1', snapX);
      hLine.setAttribute('x2', snapX);
      hLine.style.display = 'block';

      tip.style.display = 'block';
      const tipX = (e.clientX + 210 > window.innerWidth) ? (e.clientX - 205) : (e.clientX + 14);
      tip.style.left = tipX + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.innerHTML =
        '<b>Tanggal Akhir Window: ' + item.d + '</b><br>' +
        '<span style="color:#d62728;">&#9632;</span> Klaster 2 (High Volatility): <b>' + item.k2.toFixed(2) + '%</b><br>' +
        '<span style="color:#1f77b4;">&#9632;</span> Klaster 1 (Medium Volatility): <b>' + item.k1.toFixed(2) + '%</b><br>' +
        '<span style="color:#2ca02c;">&#9632;</span> Klaster 0 (Low Volatility): <b>' + item.k0.toFixed(2) + '%</b>';
    });

    overlay.addEventListener('mouseleave', function() {
      hLine.style.display = 'none';
      tip.style.display = 'none';
    });
  }

  function renderSlider() {
    const wrap = document.getElementById('rangeSlider');
    const W = 1040, H = 64;
    const padL = 44, padR = 12, padT = 6, padB = 6;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const total = allRows.length - 1;

    const polys = buildPolygons(allRows, W, H, padL, padR, padT, padB);
    const xStart = padL + (startIdx / total) * plotW;
    const xEnd = padL + (endIdx / total) * plotW;

    wrap.innerHTML =
      '<svg id="sliderSvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<rect x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="#e5ecf6"/>' +
      polys.polyK0 +
      polys.polyK1 +
      polys.polyK2 +
      '<rect x="' + padL + '" y="' + padT + '" width="' + Math.max(0, xStart - padL) + '" height="' + plotH + '" fill="#ffffff" fill-opacity="0.62"/>' +
      '<rect x="' + xEnd + '" y="' + padT + '" width="' + Math.max(0, (W - padR) - xEnd) + '" height="' + plotH + '" fill="#ffffff" fill-opacity="0.62"/>' +
      '<rect id="winBox" x="' + xStart + '" y="' + padT + '" width="' + Math.max(4, xEnd - xStart) + '" height="' + plotH + '" fill="transparent" stroke="#64748b" stroke-width="1.2" style="cursor:grab;"/>' +
      '<rect id="handleL" x="' + (xStart - 3) + '" y="' + (padT + 12) + '" width="6" height="' + (plotH - 24) + '" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.2" style="cursor:ew-resize;"/>' +
      '<rect id="handleR" x="' + (xEnd - 3) + '" y="' + (padT + 12) + '" width="6" height="' + (plotH - 24) + '" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.2" style="cursor:ew-resize;"/>' +
      '</svg>';

    const svgS = document.getElementById('sliderSvg');
    let dragMode = null;
    let dragOffset = 0;

    function clientToIdx(clientX) {
      const rect = svgS.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      const ratio = Math.max(0, Math.min(1, (relX - padL) / plotW));
      return Math.round(ratio * total);
    }

    document.getElementById('handleL').addEventListener('mousedown', function(e) {
      dragMode = 'left';
      e.stopPropagation();
    });
    document.getElementById('handleR').addEventListener('mousedown', function(e) {
      dragMode = 'right';
      e.stopPropagation();
    });
    document.getElementById('winBox').addEventListener('mousedown', function(e) {
      dragMode = 'move';
      dragOffset = clientToIdx(e.clientX) - startIdx;
      e.stopPropagation();
    });

    window.onmousemove = function(e) {
      if (!dragMode) return;
      const cur = clientToIdx(e.clientX);
      if (dragMode === 'left') {
        startIdx = Math.min(cur, endIdx - 5);
      } else if (dragMode === 'right') {
        endIdx = Math.max(cur, startIdx + 5);
      } else if (dragMode === 'move') {
        const span = endIdx - startIdx;
        let ns = cur - dragOffset;
        ns = Math.max(0, Math.min(total - span, ns));
        startIdx = ns;
        endIdx = ns + span;
      }
      renderMain();
      renderSlider();
    };

    window.onmouseup = function() {
      dragMode = null;
    };
  }

  renderMain();
  renderSlider();
</script>
