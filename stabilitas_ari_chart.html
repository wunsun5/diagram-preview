      const px = getX(i);
      grid += '<line x1="' + px + '" y1="' + padT + '" x2="' + px + '" y2="' + (H - padB) + '" stroke="#ffffff" stroke-width="1.1"/>';
      xLabels += '<text x="' + px + '" y="' + (H - padB + 15) + '" font-size="10.5" text-anchor="middle" fill="#2a3f5f">' + formatBulanTahun(rows[i].d) + '</text>';
    }

    let pts = [];
    let dots = '';
    for (let i = 0; i < n; i++) {
      const px = getX(i);
      const py = getY(rows[i].ari);
      pts.push(px + ',' + py);
      dots += '<circle cx="' + px + '" cy="' + py + '" r="2.5" fill="#1f77b4"/>';
    }

    const yMean = getY(meanAri);
    const meanLine =
      '<line x1="' + padL + '" y1="' + yMean + '" x2="' + (W - padR) + '" y2="' + yMean + '" stroke="#d62728" stroke-width="1.3" stroke-dasharray="6,4"/>' +
      '<rect x="' + (W - padR - 118) + '" y="' + (yMean + 4) + '" width="114" height="15" rx="2" fill="#ffffff" fill-opacity="0.82"/>' +
      '<text x="' + (W - padR - 6) + '" y="' + (yMean + 15) + '" font-size="10.5" font-weight="600" text-anchor="end" fill="#d62728">Rata-rata ARI (' + meanAri.toFixed(2) + ')</text>';

    wrap.innerHTML =
      '<svg class="chart-svg" id="mainSvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      grid +
      '<polyline fill="none" stroke="#1f77b4" stroke-width="1.8" points="' + pts.join(' ') + '"/>' +
      dots +
      meanLine +
      xLabels +
      '<text x="14" y="' + (padT + plotH / 2) + '" font-size="11.5" text-anchor="middle" fill="#2a3f5f" transform="rotate(-90 14 ' + (padT + plotH / 2) + ')">Adjusted Rand Index (ARI)</text>' +
      '<line id="hoverLine" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" stroke="#2a3f5f" stroke-width="1" stroke-dasharray="3,3" style="display:none;"/>' +
      '<circle id="hoverDot" cx="0" cy="0" r="4.5" fill="#1f77b4" stroke="#ffffff" stroke-width="1.5" style="display:none;"/>' +
      '<rect id="overlayRect" x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="transparent" style="cursor:crosshair;"/>' +
      '</svg>';

    const svgEl = document.getElementById('mainSvg');
    const overlay = document.getElementById('overlayRect');
    const hLine = document.getElementById('hoverLine');
    const hDot = document.getElementById('hoverDot');
    const tip = document.getElementById('tooltip');

    overlay.addEventListener('mousemove', function(e) {
      const rect = svgEl.getBoundingClientRect();
      const relX = ((e.clientX - rect.left) / rect.width) * W;
      let ratio = (relX - padL) / plotW;
      ratio = Math.max(0, Math.min(1, ratio));
      const idx = Math.round(ratio * (n - 1));
      const item = rows[idx];
      const snapX = getX(idx);
      const snapY = getY(item.ari);

      hLine.setAttribute('x1', snapX);
      hLine.setAttribute('x2', snapX);
      hLine.style.display = 'block';

      hDot.setAttribute('cx', snapX);
      hDot.setAttribute('cy', snapY);
      hDot.style.display = 'block';

      tip.style.display = 'block';
      const tipX = (e.clientX + 205 > window.innerWidth) ? (e.clientX - 200) : (e.clientX + 14);
      tip.style.left = tipX + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      tip.innerHTML =
        '<b>Tanggal: ' + item.d + '</b><br>' +
        'ARI Score: <b style="color:#1f77b4;">' + item.ari.toFixed(4) + '</b><br>' +
        'Turnover Rate: <b>' + item.turn.toFixed(2) + '%</b><br>' +
        'Emiten Irisan: ' + item.n;
    });

    overlay.addEventListener('mouseleave', function() {
      hLine.style.display = 'none';
      hDot.style.display = 'none';
      tip.style.display = 'none';
    });
  }

  function renderSlider() {
    const wrap = document.getElementById('rangeSlider');
    const W = 1040, H = 62;
    const padL = 48, padR = 14, padT = 6, padB = 6;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const yMin = -0.1, yMax = 1.05;
    const total = allRows.length - 1;

    let pts = [];
    for (let i = 0; i <= total; i++) {
      const px = padL + (i / total) * plotW;
      const py = padT + plotH - ((allRows[i].ari - yMin) / (yMax - yMin)) * plotH;
      pts.push(px + ',' + py);
    }

    const xStart = padL + (startIdx / total) * plotW;
    const xEnd = padL + (endIdx / total) * plotW;

    wrap.innerHTML =
      '<svg class="chart-svg" id="sliderSvg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<rect x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="#e5ecf6"/>' +
      '<polyline fill="none" stroke="#1f77b4" stroke-width="1.3" points="' + pts.join(' ') + '"/>' +
      '<rect x="' + padL + '" y="' + padT + '" width="' + Math.max(0, xStart - padL) + '" height="' + plotH + '" fill="#ffffff" fill-opacity="0.62"/>' +
      '<rect x="' + xEnd + '" y="' + padT + '" width="' + Math.max(0, (W - padR) - xEnd) + '" height="' + plotH + '" fill="#ffffff" fill-opacity="0.62"/>' +
      '<rect id="winBox" x="' + xStart + '" y="' + padT + '" width="' + Math.max(4, xEnd - xStart) + '" height="' + plotH + '" fill="transparent" stroke="#64748b" stroke-width="1.2" style="cursor:grab;"/>' +
      '<rect id="handleL" x="' + (xStart - 3) + '" y="' + (padT + 12) + '" width="6" height="' + (plotH - 24) + '" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.2" style="cursor:ew-resize;"/>' +
      '<rect id="handleR" x="' + (xEnd - 3) + '" y="' + (padT + 12) + '" width="6" height="' + (plotH - 24) + '" rx="2" fill="#ffffff" stroke="#475569" stroke-width="1.2" style="cursor:ew-resize;"/>' +
      '</svg>';

    const svgS = document.getElementById('sliderSvg');
    let dragMode = null;
    let dragOffset = 0;

    function clientToIdx(clientX) {
      const rect = svgS.getBoundingClientRect();
      const relX = ((clientX - rect.left) / rect.width) * W;
      const ratio = Math.max(0, Math.min(1, (relX - padL) / plotW));
      return Math.round(ratio * total);
    }

    document.getElementById('handleL').addEventListener('mousedown', function(e) { dragMode = 'left'; e.stopPropagation(); });
    document.getElementById('handleR').addEventListener('mousedown', function(e) { dragMode = 'right'; e.stopPropagation(); });
    document.getElementById('winBox').addEventListener('mousedown', function(e) {
      dragMode = 'move';
      dragOffset = clientToIdx(e.clientX) - startIdx;
      e.stopPropagation();
    });

    window.onmousemove = function(e) {
      if (!dragMode) return;
      const cur = clientToIdx(e.clientX);
      if (dragMode === 'left') startIdx = Math.min(cur, endIdx - 5);
      else if (dragMode === 'right') endIdx = Math.max(cur, startIdx + 5);
      else if (dragMode === 'move') {
        const span = endIdx - startIdx;
        let ns = Math.max(0, Math.min(total - span, cur - dragOffset));
        startIdx = ns;
        endIdx = ns + span;
      }
      renderMain();
      renderSlider();
    };

    window.onmouseup = function() { dragMode = null; };
  }

  renderMain();
  renderSlider();
</script>
</body>
</html>
